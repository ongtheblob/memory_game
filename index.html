
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Two Player Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">

        <header>
            <h1>🧠 Memory Match</h1>
            <p>Challenge your memory. Find the matching pairs!</p>
        </header>

        <section class="players">

            <div class="player active" id="player1">
                <h2>Player 1</h2>
                <div class="score" id="score1">0</div>
                <p>Pairs found</p>
            </div>

            <div class="player" id="player2">
                <h2>Player 2</h2>
                <div class="score" id="score2">0</div>
                <p>Pairs found</p>
            </div>

        </section>

        <div class="game-info">
            <h3 id="turnIndicator">Player 1's Turn</h3>
            <p id="gameMessage">Flip two cards to find a matching pair!</p>
        </div>

        <section class="game-board" id="gameBoard">
            <!-- Cards are generated using JavaScript -->
        </section>

        <div class="game-controls">
            <button id="restartButton">🔄 Restart Game</button>
        </div>

        <div class="winner-message" id="winnerMessage" hidden>
            <h2 id="winnerText"></h2>
            <p id="finalScore"></p>
            <button id="playAgainButton">Play Again</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
